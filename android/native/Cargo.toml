[package]
name = "worldpainter-bedrock"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "worldpainter_bedrock"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21.1"
rusty-leveldb = "4.0.1"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
